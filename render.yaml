services:
  - type: web
    name: support-agent
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: support-agent-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: FRONTEND_ORIGIN
        value: https://support-agent.onrender.com
      - key: AUTH_JWT_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MAIN_PROVIDER
        value: gemini
      - key: LLM_DAILY_CALL_CAP
        value: "1000"
      - key: TICKET_RATE_LIMIT_PER_IP
        value: "8"
      - key: TICKET_RATE_LIMIT_PER_SESSION
        value: "4"
      - key: TICKET_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: DEMO_RESET_COOLDOWN_SECONDS
        value: "60"
      - key: MAX_REQUEST_BODY_BYTES
        value: "16384"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: LOG_LEVEL
        value: INFO
      - key: WEB_CONCURRENCY
        value: "1"
      - key: LANGGRAPH_STRICT_MSGPACK
        value: "true"
      - key: REFUND_WINDOW_DAYS
        value: "30"
      - key: REFUND_AUTO_LIMIT
        value: "2000"
      - key: MAX_LOOPS
        value: "2"
databases:
  - name: support-agent-db
    databaseName: support_agent
    user: support_agent
    plan: 0.5c-1g
    region: oregon
    postgresMajorVersion: "16"
