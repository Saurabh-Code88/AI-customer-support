services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-support_agent}
      POSTGRES_USER: ${POSTGRES_USER:-support_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_support_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://support_agent:local_support_password@db:5432/support_agent}
      DATABASE_PATH: /var/lib/support-agent/support_agent.db
      DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-3}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-only-change-me-use-a-random-secret}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      MAIN_PROVIDER: ${MAIN_PROVIDER:-gemini}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_RETRY_BASE_SECONDS: ${LLM_RETRY_BASE_SECONDS:-0.25}
      LLM_DAILY_CALL_CAP: ${LLM_DAILY_CALL_CAP:-1000}
      TICKET_RATE_LIMIT_PER_IP: ${TICKET_RATE_LIMIT_PER_IP:-8}
      TICKET_RATE_LIMIT_PER_SESSION: ${TICKET_RATE_LIMIT_PER_SESSION:-4}
      TICKET_RATE_LIMIT_WINDOW_SECONDS: ${TICKET_RATE_LIMIT_WINDOW_SECONDS:-60}
      DEMO_RESET_COOLDOWN_SECONDS: ${DEMO_RESET_COOLDOWN_SECONDS:-60}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-16384}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8000}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      APP_ENV: ${APP_ENV:-development}
      ENV: ${ENV:-}
      PORT: ${PORT:-8000}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LANGGRAPH_STRICT_MSGPACK: ${LANGGRAPH_STRICT_MSGPACK:-true}
      REFUND_WINDOW_DAYS: ${REFUND_WINDOW_DAYS:-30}
      REFUND_AUTO_LIMIT: ${REFUND_AUTO_LIMIT:-2000}
      MAX_LOOPS: ${MAX_LOOPS:-2}
    ports:
      - "${PORT:-8000}:${PORT:-8000}"

volumes:
  postgres_data:
